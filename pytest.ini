[pytest]
pythonpath = src scripts
testpaths = tests
python_files = test_*.py
python_functions = test_*
# ECB / GREEN / REFACTOR gate: exclude Skeleton RED (24× pytest.fail until Full RED→GREEN).
addopts = -m "not dual_track_red"
markers =
    golden_master: Golden Master / Approval regression tests (GM-2)
    dual_track_red: Dual-Track skeleton RED (pytest.fail only; run with: pytest -m dual_track_red)
